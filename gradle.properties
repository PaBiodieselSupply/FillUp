org.gradle.jvmargs=-Xmx2048m

android.useAndroidX=true
android.nonTransitiveRClass=true

# LOAD-BEARING: AGP 8 makes R fields non-final by default, and a non-final int
# cannot be used as a switch case label. This codebase has 8 switch statements
# over R.id covering 32 case labels (GasLogListActivity, MainActivity,
# GasRecordActivity, PlotDateRangeButtons, StatisticsActivity, PlotActivity).
# Removing this line means rewriting all of them as if/else chains.
android.nonFinalResIds=false

# Workaround: androidplot-core-0.6.0.jar has malformed EnclosingMethod/InnerClasses
# attributes that D8 strict-mode rejects. This flag routes through the full-classpath
# dexing path which tolerates the bad attributes.
android.useFullClasspathForDexingTransform=true
